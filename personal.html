<script>

/* =========================================================
   CONFIGURACIÓN MSAL
   ========================================================= */

const msalConfig = {
    auth: {
        clientId: "5d98417c-74a7-4fab-8f2c-41ac127be696",
        authority: "https://login.microsoftonline.com/dbab984f-4bb1-4b60-9dff-da59f54acdf1",
        redirectUri: "https://alvaroalferza.github.io/live-office/blank.html"
    },
    cache: {
        cacheLocation: "sessionStorage"
    }
};

const scopes = [
    "User.Read",
    "Presence.Read.All"
];

const msalInstance =
    new msal.PublicClientApplication(msalConfig);


/* =========================================================
   OBTENER TOKEN
   ========================================================= */

async function obtenerToken() {

    let cuenta = msalInstance.getAllAccounts()[0];

    if (!cuenta) {

        const loginResponse =
            await msalInstance.loginPopup({
                scopes
            });

        cuenta = loginResponse.account;
    }

    try {

        const response =
            await msalInstance.acquireTokenSilent({
                scopes,
                account: cuenta
            });

        return response.accessToken;

    } catch (error) {

        const response =
            await msalInstance.acquireTokenPopup({
                scopes
            });

        return response.accessToken;
    }
}


/* =========================================================
   DATOS DE PISOS
   ========================================================= */

const floorData = {
    1: 11,
    2: 25,
    3: 12
};

const floorLabels = {
    "1": "1ᵉʳ Piso",
    "2": "2ᵈᵒ Piso",
    "3": "3ᵉʳ Piso"
};


/* =========================================================
   ELEMENTOS DEL DOM
   ========================================================= */

const floorTabs =
    document.querySelectorAll(".floor-tab");

const floorViews =
    document.querySelectorAll(".floor-view");

const employeeCount =
    document.getElementById("employeeCount");

const searchInput =
    document.getElementById("personalSearch");

const refreshButton =
    document.getElementById("refreshPersonal");


/* =========================================================
   ESTADOS
   ========================================================= */

const statusMeta = {

    available: {
        label: "Disponible",
        cls: "status-available"
    },

    busy: {
        label: "Ocupado",
        cls: "status-busy"
    },

    away: {
        label: "Ausente",
        cls: "status-away"
    },

    offline: {
        label: "Offline",
        cls: "status-offline"
    }

};


/* =========================================================
   NORMALIZAR NOMBRES
   =========================================================
   Sirve para que:
   "Alvaro Durand"
   y
   "Álvaro Durand"

   puedan considerarse el mismo trabajador.
   ========================================================= */

function normalizarNombre(nombre) {

    return nombre
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();
}


/* =========================================================
   CONVERTIR PRESENCIA DE TEAMS A CLASE
   ========================================================= */

function convertirEstado(availability) {

    switch (availability) {

        case "Available":
            return {
                estado: "available",
                clase: "employee-available",
                label: "Disponible"
            };

        case "Busy":
        case "InAMeeting":
        case "OnACall":
            return {
                estado: "busy",
                clase: "employee-busy",
                label: "Ocupado"
            };

        case "Away":
        case "BeRightBack":
            return {
                estado: "away",
                clase: "employee-away",
                label: "Ausente"
            };

        default:
            return {
                estado: "offline",
                clase: "employee-offline",
                label: "Offline"
            };
    }
}


/* =========================================================
   CARGAR PRESENCIA DE MICROSOFT TEAMS
   ========================================================= */

async function cargarPresenciaPersonal() {

    try {

        console.log("Actualizando presencia de Teams...");

        const TOKEN =
            await obtenerToken();


        /* -------------------------------------------------
           OBTENER USUARIOS DE ALFERZA
           ------------------------------------------------- */

        const respuestaUsuarios =
            await fetch(
                "https://graph.microsoft.com/v1.0/users?$top=999",
                {
                    headers: {
                        Authorization:
                            `Bearer ${TOKEN}`
                    }
                }
            );


        if (!respuestaUsuarios.ok) {

            throw new Error(
                "No se pudieron obtener los usuarios."
            );
        }


        const dataUsuarios =
            await respuestaUsuarios.json();


        const usuarios =
            dataUsuarios.value.filter(
                usuario =>
                    usuario.mail &&
                    usuario.mail
                        .toLowerCase()
                        .endsWith("@alferza.pe")
            );


        console.log(
            "Usuarios encontrados:",
            usuarios.length
        );


        /* -------------------------------------------------
           CREAR MAPA DE USUARIOS POR NOMBRE
           ------------------------------------------------- */

        const usuariosPorNombre = {};


        usuarios.forEach(usuario => {

            const nombre =
                normalizarNombre(
                    usuario.displayName || ""
                );

            usuariosPorNombre[nombre] =
                usuario;
        });


        /* -------------------------------------------------
           IDS PARA CONSULTAR PRESENCIA
           ------------------------------------------------- */

        const idsUsuarios =
            usuarios.map(
                usuario => usuario.id
            );


        let presenciaPorId = {};


        /* -------------------------------------------------
           CONSULTAR PRESENCIA DE TODOS
           ------------------------------------------------- */

        if (idsUsuarios.length > 0) {

            const presenciaResponse =
                await fetch(
                    "https://graph.microsoft.com/v1.0/communications/getPresencesByUserId",
                    {
                        method: "POST",

                        headers: {
                            Authorization:
                                `Bearer ${TOKEN}`,

                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            ids: idsUsuarios
                        })
                    }
                );


            if (presenciaResponse.ok) {

                const presenciaData =
                    await presenciaResponse.json();


                (presenciaData.value || [])
                    .forEach(presencia => {

                        presenciaPorId[
                            presencia.id
                        ] = presencia;

                    });

            } else {

                console.warn(
                    "No se pudo obtener la presencia."
                );
            }
        }


        /* -------------------------------------------------
           RECORRER LOS EMPLEADOS DEL MAPA
           ------------------------------------------------- */

        const empleados =
            document.querySelectorAll(
                ".employee:not(.employee-vacant)"
            );


        empleados.forEach(card => {

            const nombreMapa =
                normalizarNombre(
                    card.dataset.name || ""
                );


            const usuario =
                usuariosPorNombre[
                    nombreMapa
                ];


            /* ---------------------------------------------
               SI NO EXISTE EN MICROSOFT GRAPH
               --------------------------------------------- */

            if (!usuario) {

                console.warn(
                    "No encontrado en Microsoft Graph:",
                    card.dataset.name
                );

                actualizarTarjetaEstado(
                    card,
                    "offline"
                );

                return;
            }


            /* ---------------------------------------------
               OBTENER PRESENCIA
               --------------------------------------------- */

            const presencia =
                presenciaPorId[
                    usuario.id
                ];


            const availability =
                presencia?.availability ||
                "Offline";


            const resultado =
                convertirEstado(
                    availability
                );


            /* ---------------------------------------------
               ACTUALIZAR TARJETA
               --------------------------------------------- */

            actualizarTarjetaEstado(
                card,
                resultado.estado
            );


            /* ---------------------------------------------
               GUARDAR DATOS REALES
               --------------------------------------------- */

            card.dataset.estado =
                resultado.estado;

            card.dataset.teamsStatus =
                availability;

            card.dataset.userId =
                usuario.id;

            card.dataset.email =
                usuario.mail || "";


            console.log(
                card.dataset.name,
                "→",
                availability
            );

        });


        console.log(
            "Presencia actualizada correctamente."
        );


    } catch (error) {

        console.error(
            "Error actualizando presencia:",
            error
        );

    }
}


/* =========================================================
   ACTUALIZAR CLASE VISUAL DE UNA TARJETA
   ========================================================= */

function actualizarTarjetaEstado(
    card,
    estado
) {

    /* Eliminar estados anteriores */

    card.classList.remove(
        "employee-available",
        "employee-busy",
        "employee-away",
        "employee-offline"
    );


    /* Agregar nuevo estado */

    card.classList.add(
        "employee-" + estado
    );


    /* Actualizar indicador pequeño
       del avatar */

    const indicador =
        card.querySelector(
            ".employee-avatar i"
        );


    if (indicador) {

        indicador.classList.remove(
            "available",
            "busy",
            "away",
            "offline"
        );

        indicador.classList.add(
            estado
        );
    }
}


/* =========================================================
   ACTIVAR PISO
   ========================================================= */

function activarPiso(piso) {

    floorTabs.forEach(tab => {

        tab.classList.toggle(
            "active",
            tab.dataset.floor === piso
        );

    });


    floorViews.forEach(view => {

        view.hidden =
            view.dataset.floorView !== piso;

    });


    employeeCount.innerText =
        floorData[piso] ?? 0;


    searchInput.value = "";

    filtrarEmpleados("");
}


floorTabs.forEach(tab => {

    tab.addEventListener(
        "click",
        () => activarPiso(
            tab.dataset.floor
        )
    );

});


/* =========================================================
   BUSCADOR
   ========================================================= */

function filtrarEmpleados(valor) {

    const value =
        valor
            .toLowerCase()
            .trim();


    document
        .querySelectorAll(
            ".floor-view:not([hidden]) .employee"
        )
        .forEach(employee => {

            const texto = (

                employee.dataset.name +
                " " +
                employee.dataset.role

            ).toLowerCase();


            if (texto.includes(value)) {

                employee.style.opacity = "1";

                employee.style.transform =
                    "scale(1)";

            } else {

                employee.style.opacity = ".18";

                employee.style.transform =
                    "scale(.96)";
            }

        });
}


searchInput.addEventListener(
    "input",
    function () {

        filtrarEmpleados(
            this.value
        );

    }
);


/* =========================================================
   MODAL
   ========================================================= */

const modalOverlay =
    document.getElementById(
        "employeeModalOverlay"
    );

const modalClose =
    document.getElementById(
        "employeeModalClose"
    );

const modalAvatar =
    document.getElementById(
        "modalAvatar"
    );

const modalStatus =
    document.getElementById(
        "modalStatus"
    );

const modalStatusText =
    document.getElementById(
        "modalStatusText"
    );

const modalName =
    document.getElementById(
        "modalEmployeeName"
    );

const modalRole =
    document.getElementById(
        "modalEmployeeRole"
    );

const modalFloor =
    document.getElementById(
        "modalFloor"
    );

const modalRoom =
    document.getElementById(
        "modalRoom"
    );


/* =========================================================
   ABRIR MODAL
   ========================================================= */

function abrirModalEmpleado(card) {

    const esVacante =
        card.classList.contains(
            "employee-vacant"
        );


    const sinDatos =
        card.classList.contains(
            "employee-unlabeled"
        );


    const nombre =
        card.dataset.name || "—";


    const cargo =
        card.dataset.role || "—";


    const sala =
        card.closest(".room")
            ?.querySelector(
                ".room-header-purple h3"
            )
            ?.innerText
            .trim()
            .replace(/\s+/g, " ")
        || "—";


    const pisoKey =
        card.closest(".floor-view")
            ?.dataset
            .floorView;


    modalName.innerText =
        esVacante
            ? "Puesto disponible"
            : nombre;


    modalRole.innerText =
        esVacante
            ? "Sin colaborador asignado"
            : cargo;


    modalFloor.innerText =
        floorLabels[pisoKey] || "—";


    modalRoom.innerText =
        sala;


    modalAvatar.classList.toggle(
        "modal-avatar-vacant",
        esVacante
    );


    modalAvatar.innerText =
        esVacante
            ? "➕"
            : "👤";


    /* -----------------------------------------------------
       VACANTE
       ----------------------------------------------------- */

    if (esVacante) {

        modalStatus.style.display =
            "none";

    }

    /* -----------------------------------------------------
       SIN DATOS
       ----------------------------------------------------- */

    else if (sinDatos) {

        modalStatus.style.display =
            "";

        modalStatus.className =
            "employee-modal-status status-offline";

        modalStatusText.innerText =
            "Puesto ocupado · sin datos registrados";

    }

    /* -----------------------------------------------------
       EMPLEADO NORMAL
       ----------------------------------------------------- */

    else {

        let estado =
            card.dataset.estado ||
            "offline";


        const meta =
            statusMeta[estado] ||
            statusMeta.offline;


        modalStatus.style.display =
            "";


        modalStatus.className =
            "employee-modal-status " +
            meta.cls;


        modalStatusText.innerText =
            meta.label;
    }


    modalOverlay.classList.add(
        "open"
    );

    document.body.classList.add(
        "modal-open"
    );
}


/* =========================================================
   CERRAR MODAL
   ========================================================= */

function cerrarModalEmpleado() {

    modalOverlay.classList.remove(
        "open"
    );

    document.body.classList.remove(
        "modal-open"
    );
}


modalClose.addEventListener(
    "click",
    cerrarModalEmpleado
);


modalOverlay.addEventListener(
    "click",
    function (e) {

        if (
            e.target === modalOverlay
        ) {

            cerrarModalEmpleado();
        }

    }
);


document.addEventListener(
    "keydown",
    function (e) {

        if (
            e.key === "Escape" &&
            modalOverlay.classList.contains(
                "open"
            )
        ) {

            cerrarModalEmpleado();
        }

    }
);


/* =========================================================
   EVENTOS DE LAS TARJETAS
   ========================================================= */

document
    .querySelectorAll(".employee")
    .forEach(card => {

        card.addEventListener(
            "click",
            () => abrirModalEmpleado(card)
        );

    });


/* =========================================================
   BOTÓN ACTUALIZAR
   ========================================================= */

refreshButton.addEventListener(
    "click",
    async function () {

        this.classList.add(
            "rotating"
        );


        try {

            await cargarPresenciaPersonal();

        } finally {

            setTimeout(() => {

                this.classList.remove(
                    "rotating"
                );

            }, 600);

        }

    }
);


/* =========================================================
   CARGA INICIAL
   ========================================================= */

cargarPresenciaPersonal();


/* =========================================================
   ACTUALIZAR CADA 5 MINUTOS
   ========================================================= */

setInterval(
    cargarPresenciaPersonal,
    300000
);

</script>
